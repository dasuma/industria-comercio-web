# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - ind-com

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: zuama.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_41CDDECCA97847C7BEF45AFC374BF2A8 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_39A32153E62F48188701E88AD8843501 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: zuama.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_41CDDECCA97847C7BEF45AFC374BF2A8 }}/indcom-img:${{ github.sha }}
          file: ./Dockerfile
          # Solo NPM_TOKEN (GitHub Packages) y la versión. La config por ciudad
          # (BACKEND_URL, CITY_NAME, FIREBASE_*, ...) va en los app settings del
          # App Service y se lee en runtime: no hace falta un build por ciudad.
          build-args: |
            NPM_TOKEN=${{ secrets.NPM_TOKEN }}
            APP_VERSION=${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_15FA9F451862490697F295B940665C8F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E163070AA67549F08FBC005B1DAF58A7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_01627CB4A09C4FE89B75F68B7171AAE6 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'ind-com'
          slot-name: 'Production'
          images: 'zuama.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_41CDDECCA97847C7BEF45AFC374BF2A8 }}/indcom-img:${{ github.sha }}'
          